services:

  # =========================================================
  # MySQL
  # =========================================================

  mysql:
    image: mysql:8.0
    container_name: enterprise-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: enterprise_project_management

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${DB_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  # =========================================================
  # Spring Boot Backend
  # =========================================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: enterprise-backend
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      DB_URL: jdbc:mysql://mysql:3306/enterprise_project_management
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}

      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      JPA_SHOW_SQL: ${JPA_SHOW_SQL}
      FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE}

      MAX_FILE_SIZE: ${MAX_FILE_SIZE}
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE}

      GMAIL_USERNAME: ${GMAIL_USERNAME}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}

    ports:
      - "8080:8080"

    volumes:
      - backend_uploads:/app/uploads


  # =========================================================
  # React Frontend
  # =========================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: enterprise-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "5173:80"


# =========================================================
# Persistent Volumes
# =========================================================

volumes:

  mysql_data:

  backend_uploads: